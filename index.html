<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>블록 브레이커 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0f1724; font-family: system-ui, "Malgun Gothic", sans-serif; color: #fff; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; cursor: crosshair; touch-action: none; }
  /* 상단 정보 바: 어두운 유리 패널 하나에 칸을 나눠 담는다 */
  #hud { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 20px); box-sizing: border-box; display: flex; align-items: stretch; padding: 11px 6px; background: linear-gradient(180deg, rgba(28,30,58,.62), rgba(10,11,26,.62)); border: 1px solid rgba(255,255,255,.13); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.10); backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%); pointer-events: none; }
  #hud .cell { display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 0 16px; min-width: 0; }
  #hud .cell + .cell { border-left: 1px solid rgba(255,255,255,.10); }
  #hud .k { font-size: 11px; font-weight: 600; letter-spacing: .12em; color: rgba(200,208,255,.58); white-space: nowrap; }
  #hud .v { font-size: 18.5px; font-weight: 700; letter-spacing: .01em; color: #f4f5ff; white-space: nowrap; font-variant-numeric: tabular-nums; line-height: 1.15; }
  #hud .gold { color: #f3d58c; }
  #hud .dots { display: flex; align-items: center; gap: 4px; height: 21px; }
  #hud .dots i { width: 8px; height: 8px; border-radius: 50%; background: #9fe8ff; box-shadow: 0 0 6px rgba(120,220,255,.8); }
  #hud .dots i.used { background: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.22); }

  #ver { margin-top: 12px; font-size: 10px; letter-spacing: .1em; color: rgba(200,208,255,.4); }
  #mute { pointer-events: auto; align-self: center; flex: none; width: 40px; height: 40px; margin: 0 6px 0 2px; padding: 0; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.14); border-radius: 10px; background: rgba(255,255,255,.06); color: #dfe4ff; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #mute svg { width: 20px; height: 20px; }
  #mute.off { color: rgba(223,228,255,.45); }
  /* 폰 폭에서는 바를 화면 폭에 맞추고 칸 여백을 줄여 공 9개까지 한 줄에 담는다 */
  @media (max-width: 480px) {
    #hud { width: calc(100% - 16px); max-width: none; padding: 10px 2px; }
    #hud .cell { padding: 0 8px; flex: 1 1 auto; }
    #hud .k { font-size: 10.5px; }
    #hud .v { font-size: 16px; }
    #hud .dots { gap: 3px; height: 20px; }
    #hud .dots i { width: 7px; height: 7px; }
    #mute { width: 38px; height: 38px; margin: 0 5px 0 0; }
  }
  #help { position: fixed; bottom: 16px; left: 16px; font-size: 13px; font-weight: 600; text-shadow: 0 1px 3px rgba(40,0,60,.9); text-align: center; pointer-events: none; padding: 6px 14px; background: rgba(40,10,80,.45); border-radius: 999px; white-space: nowrap; }
  #touch { position: fixed; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom)); display: none; justify-content: space-between; padding: 0 14px; pointer-events: none; }
  #touch button { pointer-events: auto; width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(255,255,255,.5); background: linear-gradient(135deg, rgba(88,60,255,.6), rgba(25,211,243,.6)); box-shadow: 0 2px 14px rgba(25,211,243,.4); color: #fff; font-size: 26px; touch-action: none; -webkit-tap-highlight-color: transparent; }
  #touch button.on { background: rgba(255,138,61,.7); }
  #touch .grp { display: flex; gap: 2px; }
  /* 회전 화살표는 테두리 원 없이 화살표만 보인다 (터치 영역은 그대로 넉넉하게) */
  #touch .grp button { width: 54px; height: 60px; border: 0; border-radius: 12px; background: none; box-shadow: none; font-size: 30px; text-shadow: 0 0 10px rgba(25,211,243,.95), 0 1px 3px #000; }
  /* 다시 시작: 원 없이 아이콘 + 글자 */
  #touch #t-reset { width: 60px; height: 60px; border: 0; border-radius: 12px; background: none; box-shadow: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-family: inherit; font-size: 12px; font-weight: 700; text-shadow: 0 0 8px rgba(25,211,243,.95), 0 1px 3px #000; }
  #touch #t-reset svg { width: 26px; height: 26px; filter: drop-shadow(0 0 5px rgba(25,211,243,.95)); }
  #touch #t-reset:active { color: #ffc93c; transform: scale(1.12); }
  #touch .grp button.on { background: none; color: #ffc93c; transform: scale(1.2); }
  @media (pointer: coarse) { #touch { display: flex; } #help { display: none; } }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(4,4,14,.5); pointer-events: none; }
  #overlay.hidden { display: none; }
  /* 안내 카드: 상단 바와 같은 어두운 유리 + 금색 버튼 */
  .card { pointer-events: auto; width: min(340px, calc(100% - 32px)); box-sizing: border-box; padding: 26px 24px 16px; text-align: center; border-radius: 22px; background: linear-gradient(180deg, rgba(30,32,62,.84), rgba(10,11,26,.88)); border: 1px solid rgba(255,255,255,.14); box-shadow: 0 24px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.12); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); }
  .card .logo { width: 78px; height: 78px; border-radius: 19px; box-shadow: 0 10px 26px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.16); margin-bottom: 14px; }
  .card .eyebrow { font-size: 10px; font-weight: 600; letter-spacing: .24em; color: rgba(200,208,255,.6); margin-bottom: 6px; }
  .card.plain .logo, .card.plain .eyebrow { display: none; }
  .card h1 { margin: 0 0 10px; font-size: 26px; font-weight: 800; letter-spacing: -.01em; background: linear-gradient(180deg, #ffffff, #c4ccff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .card p { margin: 0 0 20px; font-size: 14px; line-height: 1.65; color: rgba(226,230,255,.82); word-break: keep-all; }
  .card button { width: 100%; font: inherit; font-weight: 800; font-size: 16px; letter-spacing: .06em; padding: 13px; border: 0; border-radius: 14px; color: #1d1604; background: linear-gradient(180deg, #f9e4a8, #e2b655); box-shadow: 0 8px 22px rgba(226,182,85,.35), inset 0 1px 0 rgba(255,255,255,.65); cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .card button.ghost { margin-top: 8px; padding: 9px; background: none; box-shadow: none; color: rgba(226,230,255,.7); font-size: 13px; font-weight: 600; letter-spacing: 0; }
  .card button.ghost:active { filter: none; color: #fff; }
  .card button:active { transform: translateY(1px); filter: brightness(.95); }
  .card button:hover { filter: brightness(1.12); }
</style>
<script type="importmap">
{ "imports": {
  "three": "./lib/three.module.js",
  "cannon-es": "./lib/cannon-es.js"
} }
</script>
</head>
<body>
<div id="hud">
  <div class="cell"><span class="k" id="lvl-k">LEVEL 1</span><span class="v" id="lvl">피라미드</span></div>
  <div class="cell"><span class="k">블록</span><span class="v" id="blocks">0/0</span></div>
  <div class="cell"><span class="k">공</span><span class="v dots" id="balls"></span></div>
  <div class="cell"><span class="k">점수</span><span class="v gold" id="score">0</span></div>
  <button id="mute" aria-label="소리 끄기"></button>
</div>
<div id="help">클릭: 공 던지기 · A/D 또는 ←/→: 시점 회전 · R: 레벨 다시 시작</div>
<div id="touch">
  <div class="grp"><button id="t-left" aria-label="왼쪽으로 회전">◀</button><button id="t-right" aria-label="오른쪽으로 회전">▶</button></div>
  <button id="t-reset" aria-label="레벨 다시 시작">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
    <span>다시</span>
  </button>
</div>
<div id="overlay"><div class="card" id="card">
  <img class="logo" src="images/icon-192.png" alt="">
  <div class="eyebrow">3D PHYSICS GAME</div>
  <h1 id="ov-title">블록 브레이커 3D</h1>
  <p id="ov-text">공을 쏴서 섬 위의 블록을 모두 떨어뜨리세요.<br>공은 한정되어 있습니다!</p>
  <button id="ov-btn">시작</button>
  <button id="ov-new" class="ghost" hidden>처음부터 시작</button>
  <div id="ver">v14</div>
</div></div>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

// ---------- 렌더러 / 씬 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04040c);
scene.fog = new THREE.Fog(0x06050f, 45, 120);

// 노을빛 그라데이션 + 오로라가 흐르는 하늘
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { t: { value: 0 } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `varying vec3 vDir; uniform float t;
    void main(){
      float h = vDir.y * 0.5 + 0.5;
      // 어두운 우주: 거의 검은 남색 바탕에 옅은 성운만 은은하게
      vec3 c = mix(vec3(0.030, 0.018, 0.070), vec3(0.008, 0.010, 0.030), smoothstep(0.0, 1.0, h));
      float a = atan(vDir.z, vDir.x);
      float w1 = sin(a * 2.0 + t * 0.05 + h * 6.0) * 0.5 + 0.5;
      float w2 = sin(a * 3.0 - t * 0.04 - h * 9.0) * 0.5 + 0.5;
      float band = smoothstep(0.15, 0.5, h) * (1.0 - smoothstep(0.55, 0.95, h));
      c += (vec3(0.20, 0.06, 0.32) * w1 * w1 + vec3(0.03, 0.14, 0.30) * w2 * w2) * band * 0.35;
      gl_FragColor = vec4(c, 1.0);
    }`,
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(140, 32, 20), skyMat));

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 200);
let camAngle = 0;
const camTarget = new THREE.Vector3(0, 2.5, 0);
function placeCamera() {
  camera.position.set(Math.sin(camAngle) * 16, 7, Math.cos(camAngle) * 16);
  camera.lookAt(camTarget);
}
placeCamera();

scene.add(new THREE.HemisphereLight(0xd8e0ff, 0x2a2060, 0.85));
const glowA = new THREE.PointLight(0x22e0ff, 120, 40);
const glowB = new THREE.PointLight(0xff3db0, 120, 40);
scene.add(glowA, glowB);
const sun = new THREE.DirectionalLight(0xfff0dd, 1.6);
sun.position.set(8, 16, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 1, far: 50 });
scene.add(sun);

// 배경 별
{
  const g = new THREE.BufferGeometry();
  const pts = [], cols = [], c = new THREE.Color();
  for (let i = 0; i < 900; i++) {
    const v = new THREE.Vector3().randomDirection().multiplyScalar(80 + Math.random() * 40);
    pts.push(v.x, v.y, v.z);
    c.setHSL(Math.random(), 0.9, 0.75);
    cols.push(c.r, c.g, c.b);
  }
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 0.7, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false })));
}

// 섬 주위를 도는 빛나는 수정들과 고리
const VIVID = [0xff3b6b, 0xffc93c, 0x2ee59d, 0x3d8bff, 0xb264ff, 0xff7a2f, 0x19d3f3];
const crystals = [];
for (let i = 0; i < 16; i++) {
  const col = VIVID[i % VIVID.length];
  const mesh = new THREE.Mesh(
    new THREE.OctahedronGeometry(0.5 + Math.random() * 0.7),
    new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.7, roughness: 0.2, metalness: 0.3, flatShading: true })
  );
  scene.add(mesh);
  crystals.push({ mesh, r: 15 + Math.random() * 12, ang: Math.random() * Math.PI * 2, y: -5 + Math.random() * 16, speed: (0.04 + Math.random() * 0.08) * (i % 2 ? 1 : -1), spin: 0.5 + Math.random() });
}
// 플레이어 쪽 대포: 화면 아래 가운데에 있고, 조준한 곳을 향해 포신이 돈다
let platMesh;
const cannon = new THREE.Group();   // 카메라를 따라다니는 받침대
const pivot = new THREE.Group();    // 조준 방향으로 회전
const barrel = new THREE.Group();   // 발사 반동으로 앞뒤로 움직임
const muzzle = new THREE.Object3D();
const muzzleMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xff7a2f, emissiveIntensity: 1.2 });
{
  const body = new THREE.MeshStandardMaterial({ color: 0xf4f0ff, emissive: 0x8877cc, emissiveIntensity: 0.25, metalness: 0.15, roughness: 0.35 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x5a3fd0, emissive: 0x2a1a80, emissiveIntensity: 0.4, metalness: 0.2, roughness: 0.4 });
  const accent = new THREE.MeshStandardMaterial({ color: 0x19d3f3, emissive: 0x19d3f3, emissiveIntensity: 0.6, roughness: 0.3 });
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.8, 0.3, 24), dark);
  base.position.y = -0.45;
  const joint = new THREE.Mesh(new THREE.SphereGeometry(0.42, 24, 16), dark);
  const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.36, 2.2, 24).rotateX(Math.PI / 2), body);
  tube.position.z = 1.3;
  const bands = [0.6, 1.3].map(z => {
    const b = new THREE.Mesh(new THREE.TorusGeometry(0.38, 0.06, 10, 32), accent);
    b.position.z = z;
    return b;
  });
  const tip = new THREE.Mesh(new THREE.TorusGeometry(0.34, 0.09, 10, 32), muzzleMat);
  tip.position.z = 2.4;
  muzzle.position.z = 2.5;
  barrel.add(tube, ...bands, tip, muzzle);
  pivot.add(joint, barrel);
  cannon.add(base, pivot);
  cannon.scale.setScalar(0.42);
  scene.add(cannon);
}
const aimTarget = new THREE.Vector3(0, 2.5, 0);
let recoil = 0;
function updateCannon(dt) {
  camera.updateMatrixWorld();
  const halfH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * 4;
  cannon.position.set(0, -halfH * 0.84, -4);
  camera.localToWorld(cannon.position);
  cannon.quaternion.copy(camera.quaternion);
  pivot.lookAt(aimTarget);
  recoil = Math.max(0, recoil - dt * 5);
  barrel.position.z = -recoil * 0.4;
}

// 파티클(충돌 불꽃, 공 꼬리, 축하 색종이)
const P_MAX = 1200;
const pPos = new Float32Array(P_MAX * 3).fill(-999), pCol = new Float32Array(P_MAX * 3);
const pVel = new Float32Array(P_MAX * 3), pBase = new Float32Array(P_MAX * 3);
const pLife = new Float32Array(P_MAX), pSpan = new Float32Array(P_MAX), pGrav = new Float32Array(P_MAX);
let pNext = 0;
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
const pPoints = new THREE.Points(pGeo, new THREE.PointsMaterial({ size: 0.32, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
pPoints.frustumCulled = false;
scene.add(pPoints);

function emit(x, y, z, vx, vy, vz, color, life, grav = 9) {
  const i = pNext, j = i * 3;
  pNext = (pNext + 1) % P_MAX;
  pPos[j] = x; pPos[j + 1] = y; pPos[j + 2] = z;
  pVel[j] = vx; pVel[j + 1] = vy; pVel[j + 2] = vz;
  pBase[j] = color.r; pBase[j + 1] = color.g; pBase[j + 2] = color.b;
  pLife[i] = pSpan[i] = life; pGrav[i] = grav;
}
const tmpDir = new THREE.Vector3(), tmpCol = new THREE.Color();
function burst(pos, color, n, speed, life = 0.9) {
  for (let k = 0; k < n; k++) {
    tmpDir.randomDirection().multiplyScalar(speed * (0.3 + Math.random() * 0.7));
    emit(pos.x, pos.y, pos.z, tmpDir.x, tmpDir.y + speed * 0.3, tmpDir.z, color, life * (0.6 + Math.random() * 0.6));
  }
}
function confetti() {
  for (let k = 0; k < 400; k++) {
    tmpCol.set(VIVID[k % VIVID.length]);
    emit((Math.random() - 0.5) * 9, 5 + Math.random() * 6, (Math.random() - 0.5) * 9,
      (Math.random() - 0.5) * 4, Math.random() * 5, (Math.random() - 0.5) * 4, tmpCol, 2 + Math.random() * 1.5, 4);
  }
}
function updateParticles(dt) {
  for (let i = 0; i < P_MAX; i++) {
    if (pLife[i] <= 0) continue;
    const j = i * 3;
    pLife[i] -= dt;
    if (pLife[i] <= 0) { pPos[j + 1] = -999; continue; }
    pVel[j + 1] -= pGrav[i] * dt;
    pPos[j] += pVel[j] * dt; pPos[j + 1] += pVel[j + 1] * dt; pPos[j + 2] += pVel[j + 2] * dt;
    const k = pLife[i] / pSpan[i];
    pCol[j] = pBase[j] * k; pCol[j + 1] = pBase[j + 1] * k; pCol[j + 2] = pBase[j + 2] * k;
  }
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.color.needsUpdate = true;
}

// ---------- 물리 월드 ----------
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
world.allowSleep = true;
world.solver.iterations = 12;
world.broadphase = new CANNON.SAPBroadphase(world);

const matBlock = new CANNON.Material('block');
const matBall = new CANNON.Material('ball');
const matGround = new CANNON.Material('ground');
world.addContactMaterial(new CANNON.ContactMaterial(matBlock, matBlock, { friction: 0.45, restitution: 0.05 }));
world.addContactMaterial(new CANNON.ContactMaterial(matBlock, matGround, { friction: 0.5, restitution: 0.05 }));
world.addContactMaterial(new CANNON.ContactMaterial(matBall, matBlock, { friction: 0.3, restitution: 0.3 }));
world.addContactMaterial(new CANNON.ContactMaterial(matBall, matGround, { friction: 0.4, restitution: 0.4 }));

// 공중 섬(플랫폼)
const PLAT = { w: 7, h: 1, d: 7 };
{
  const body = new CANNON.Body({ mass: 0, material: matGround, shape: new CANNON.Box(new CANNON.Vec3(PLAT.w / 2, PLAT.h / 2, PLAT.d / 2)) });
  body.position.set(0, -PLAT.h / 2, 0);
  world.addBody(body);
  // 파스텔 체크무늬 바닥
  const cv = document.createElement('canvas');
  cv.width = cv.height = 256;
  const cx = cv.getContext('2d');
  for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) {
    cx.fillStyle = (i + j) % 2 ? '#3fe0a0' : '#2bc4c9';
    cx.fillRect(i * 32, j * 32, 32, 32);
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.magFilter = THREE.NearestFilter;
  const side = new THREE.MeshStandardMaterial({ color: 0xff5fa8, emissive: 0xff2d8a, emissiveIntensity: 0.25, roughness: 0.6 });
  const top = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.8 });
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(PLAT.w, PLAT.h, PLAT.d), [side, side, top, side, side, side]);
  mesh.position.copy(body.position);
  mesh.receiveShadow = true;
  scene.add(mesh);
  platMesh = mesh;
}

// ---------- 게임 오브젝트 ----------
const blocks = [];  // { body, mesh, out }
const balls = [];   // { body, mesh, born }
const COLORS = VIVID;
let ballCount = 0;

function addBlock(x, y, z, sx = 1, sy = 1, sz = 1, rotY = 0) {
  const body = new CANNON.Body({
    mass: sx * sy * sz,
    material: matBlock,
    shape: new CANNON.Box(new CANNON.Vec3(sx / 2, sy / 2, sz / 2)),
    sleepSpeedLimit: 0.15,
    sleepTimeLimit: 0.5,
  });
  body.position.set(x, y, z);
  body.quaternion.setFromEuler(0, rotY, 0);
  world.addBody(body);
  body.sleep(); // 초기 탑이 흔들리지 않도록 잠든 상태로 시작
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(sx, sy, sz),
    new THREE.MeshStandardMaterial({ color: COLORS[blocks.length % COLORS.length], emissive: COLORS[blocks.length % COLORS.length], emissiveIntensity: 0.22, roughness: 0.35, metalness: 0.1 })
  );
  mesh.castShadow = mesh.receiveShadow = true;
  scene.add(mesh);
  const blk = { body, mesh, out: false };
  body.blockRef = blk;
  blocks.push(blk);
}

const LEVELS = [
  { name: '피라미드', balls: 6, build() {
    const n = 4;
    for (let row = 0; row < n; row++)
      for (let i = 0; i < n - row; i++)
        addBlock(i - (n - row - 1) / 2, 0.5 + row, 0);
  }},
  { name: '쌍둥이 탑', balls: 7, build() {
    for (let y = 0; y < 6; y++)
      for (const x of [-1.6, 1.6])
        for (const z of [-0.5, 0.5])
          addBlock(x + (z > 0 ? 0 : 0), 0.5 + y, z, 1, 1, 1);
  }},
  { name: '젠가 타워', balls: 8, build() {
    const t = 0.5, L = 3;
    for (let layer = 0; layer < 9; layer++) {
      const y = t / 2 + layer * t;
      for (let k = -1; k <= 1; k++) {
        if (layer % 2 === 0) addBlock(k * 1.0, y, 0, 0.95, t, L);
        else addBlock(0, y, k * 1.0, L, t, 0.95);
      }
    }
  }},
  { name: '성벽', balls: 9, build() {
    for (let row = 0; row < 5; row++) {
      const off = row % 2 ? 0.5 : 0;
      for (let i = -2; i <= 2 - (row % 2); i++) addBlock(i * 1.0 + off, 0.25 + row * 0.5, -1, 1, 0.5, 0.6);
    }
    for (let y = 0; y < 4; y++) for (const x of [-2.5, 2.5]) addBlock(x, 0.5 + y, 1.5);
    addBlock(0, 0.5, 1.5, 1, 1, 1); addBlock(0, 1.5, 1.5, 1, 1, 1);
  }},
  { name: '아치 게이트', balls: 8, build() {
    for (const x of [-1.5, 1.5]) for (const z of [-0.5, 0.5]) for (let y = 0; y < 4; y++) addBlock(x, 0.5 + y, z);
    for (const z of [-0.5, 0.5]) addBlock(0, 4.25, z, 4.2, 0.5, 1);       // 상인방
    for (const x of [-1, 0, 1]) addBlock(x, 5, 0);                         // 지붕 위 블록
    for (let y = 0; y < 3; y++) addBlock(0, 0.5 + y, 0);                   // 문 안쪽 기둥
  }},
  { name: '큐브 산', balls: 9, build() {
    for (let k = 0; k < 4; k++) {
      const n = 4 - k;
      for (let i = 0; i < n; i++) for (let j = 0; j < n; j++)
        addBlock(i - (n - 1) / 2, 0.5 + k, j - (n - 1) / 2);
    }
  }},
  { name: '쌍둥이 다리', balls: 8, build() {
    for (const x of [-2.5, 2.5]) for (const z of [-0.5, 0.5]) for (let y = 0; y < 4; y++) addBlock(x, 0.5 + y, z);
    for (const z of [-0.5, 0.5]) addBlock(0, 4.2, z, 6, 0.4, 1);           // 다리 상판
    for (const x of [-1.2, 1.2]) for (const z of [-0.5, 0.5]) addBlock(x, 4.9, z);
    addBlock(0, 4.9, 0); addBlock(0, 5.9, 0);
  }},
  { name: '소용돌이 탑', balls: 8, build() {
    const t = 0.5;
    for (let layer = 0; layer < 11; layer++) {
      const r = layer * 0.45, y = t / 2 + layer * t;
      for (let k = -1; k <= 1; k++)
        addBlock(Math.cos(r) * k, y, -Math.sin(r) * k, 0.95, t, 3, r);
    }
  }},
  { name: '십자 탑', balls: 8, build() {
    for (let y = 0; y < 6; y++) addBlock(0, 0.5 + y, 0);
    for (const [dx, dz] of [[1, 0], [-1, 0], [0, 1], [0, -1]])
      for (const d of [1, 2]) for (let y = 0; y < (d === 1 ? 4 : 2); y++) addBlock(dx * d, 0.5 + y, dz * d);
  }},
  { name: '계단 탑', balls: 8, build() {
    for (let c = 0; c < 5; c++) for (const z of [-0.5, 0.5]) for (let y = 0; y <= c; y++) addBlock(c - 2, 0.5 + y, z);
  }},
  { name: '샌드위치', balls: 7, build() {
    let y = 0;
    for (let layer = 0; layer < 3; layer++) {
      for (const x of [-0.55, 0.55]) for (const z of [-0.55, 0.55]) addBlock(x, y + 0.5, z);
      y += 1;
      addBlock(0, y + 0.2, 0, 2.6, 0.4, 2.6);                              // 무거운 판
      y += 0.4;
    }
  }},
  { name: '높은 벽', balls: 8, build() {
    for (let row = 0; row < 8; row++) {
      const off = row % 2 ? 0.5 : 0;
      for (let i = -2; i <= 2 - (row % 2); i++) addBlock(i + off, 0.25 + row * 0.5, -2, 1, 0.5, 0.6);
    }
  }},
  { name: '지붕 탑', balls: 8, build() {
    for (const x of [-1.5, 1.5]) for (const z of [-1.5, 1.5]) for (let y = 0; y < 3; y++) addBlock(x, 0.5 + y, z);
    addBlock(0, 3.3, 0, 4.5, 0.6, 4.5);                                    // 지붕
    for (let k = 0; k < 3; k++) {
      const n = 3 - k;
      for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) addBlock(i - (n - 1) / 2, 4.1 + k, j - (n - 1) / 2);
    }
  }},
  { name: '삼총사', balls: 8, build() {
    [[-2.2, 5], [0, 7], [2.2, 5]].forEach(([x, h]) => {
      for (const z of [-0.5, 0.5]) for (let y = 0; y < h; y++) addBlock(x, 0.5 + y, z);
    });
  }},
  { name: '벽돌 성', balls: 9, build() {
    for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) {
      if (Math.max(Math.abs(i), Math.abs(j)) !== 2) continue;
      const corner = Math.abs(i) === 2 && Math.abs(j) === 2;
      for (let y = 0; y < (corner ? 4 : 2); y++) addBlock(i, 0.5 + y, j);
    }
  }},
  { name: '최종 요새', balls: 9, build() {
    // 속이 빈 5단 피라미드: 각 층은 테두리 블록만 쌓는다
    for (let k = 0; k < 5; k++) {
      const n = 5 - k;
      for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
        if (n > 2 && i > 0 && i < n - 1 && j > 0 && j < n - 1) continue;
        addBlock(i - (n - 1) / 2, 0.5 + k, j - (n - 1) / 2);
      }
    }
  }},
];

// 테스트용: ?level=N 으로 해당 레벨에서 시작, window.__bb 로 상태 확인
const START_LEVEL = Math.min(LEVELS.length, Math.max(1, parseInt(new URLSearchParams(location.search).get('level')) || 1)) - 1;

// ---------- 상태 ----------
let level = 0, ballsLeft = 0, score = 0, state = 'menu', endTimer = 0, levelScore = 0;
const $ = id => document.getElementById(id);

// ---------- 진행 저장: 다음에 시작할 레벨과 누적 점수를 기기에 기억 ----------
const SAVE_KEY = 'bb-progress';
function loadProgress() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (d && Number.isInteger(d.level) && d.level > 0 && d.level < LEVELS.length) return { level: d.level, score: +d.score || 0 };
  } catch {}
  return null;
}
function saveProgress(lv, sc) {
  try {
    if (lv > 0) localStorage.setItem(SAVE_KEY, JSON.stringify({ level: lv, score: sc }));
    else localStorage.removeItem(SAVE_KEY);
  } catch {}
}

function clearLevel() {
  for (const b of blocks) { world.removeBody(b.body); scene.remove(b.mesh); b.mesh.geometry.dispose(); }
  for (const b of balls) { world.removeBody(b.body); scene.remove(b.mesh); b.mesh.material.dispose(); }
  blocks.length = 0; balls.length = 0;
}

function startLevel(i) {
  clearLevel();
  level = i;
  LEVELS[i].build();
  ballsLeft = LEVELS[i].balls;
  levelScore = 0;
  state = 'play';
  endTimer = 0;
  $('overlay').classList.add('hidden');
  updateHud();
}

function knockedCount() { return blocks.filter(b => b.out).length; }

function updateHud() {
  const total = LEVELS[level].balls;
  $('lvl-k').textContent = `LEVEL ${level + 1}`;
  $('lvl').textContent = LEVELS[level].name;
  $('blocks').textContent = `${knockedCount()}/${blocks.length}`;
  // 남은 공은 채운 점, 쓴 공은 빈 점
  $('balls').innerHTML = Array.from({ length: total }, (_, i) => `<i class="${i < ballsLeft ? '' : 'used'}"></i>`).join('');
  $('score').textContent = (score + levelScore).toLocaleString();
}

function showOverlay(title, text, btn, onClick) {
  $('card').classList.add('plain'); // 로고는 첫 화면에만
  $('ov-new').hidden = true;
  $('ov-title').textContent = title;
  $('ov-text').innerHTML = text;
  $('ov-btn').textContent = btn;
  $('ov-btn').onclick = onClick;
  $('overlay').classList.remove('hidden');
}

// ---------- 효과음 (파일 없이 Web Audio로 합성) ----------
let actx = null, master = null, noiseBuf = null, lastHit = 0;
let musicGain = null, musicTimer = null, nextStep = 0, stepIdx = 0;
const VOLUME = 3.2;
// 폰 스피커에 맞춰 키운 소리라 PC 스피커·헤드폰에서는 너무 크다. 터치 기기가 아니면 줄인다.
const OUT_GAIN = matchMedia('(pointer: coarse)').matches ? 1 : 0.22; // 전체 음량(리미터 앞)
const STEP = 0.3; // 배경음 한 박(8분음표) 길이(초)
let muted = false;
try { muted = localStorage.getItem('bb-muted') === '1'; } catch {}

function audio() {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain();
    master.gain.value = VOLUME;
    // 리미터: 크게 키워도 소리가 깨지지 않게 눌러 준다
    const limiter = actx.createDynamicsCompressor();
    limiter.threshold.value = -14; limiter.knee.value = 4; limiter.ratio.value = 20;
    limiter.attack.value = 0.003; limiter.release.value = 0.15;
    const out = actx.createGain();
    out.gain.value = OUT_GAIN;
    master.connect(limiter).connect(out).connect(actx.destination);
    // 출력 크기 측정용(디버그): window.bbLevel()이 현재 최대 진폭(0~1)을 돌려준다
    const meter = actx.createAnalyser();
    meter.fftSize = 2048;
    out.connect(meter);
    const mbuf = new Float32Array(meter.fftSize);
    window.bbLevel = () => { meter.getFloatTimeDomainData(mbuf); let m = 0; for (const v of mbuf) m = Math.max(m, Math.abs(v)); return m; };
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.5, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // 배경음 전용 버스: 메아리(딜레이)를 섞어 공간감을 준다
    musicGain = actx.createGain();
    musicGain.gain.value = 1.0;
    const delay = actx.createDelay(1), fb = actx.createGain();
    delay.delayTime.value = STEP * 1.5;
    fb.gain.value = 0.35;
    // 밝은 파형(톱니·사각파)을 쓰되 너무 날카롭지 않게 고음을 살짝 깎는다
    const soften = actx.createBiquadFilter();
    soften.type = 'lowpass'; soften.frequency.value = 3800;
    musicGain.connect(soften);
    soften.connect(master);
    soften.connect(delay);
    delay.connect(fb).connect(delay);
    delay.connect(master);
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, dur, { type = 'sine', vol = 0.3, slide = 0, delay = 0 } = {}) {
  if (muted) return;
  const a = audio(), t = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(master);
  o.start(t);
  o.stop(t + dur + 0.02);
}
function noise(dur, { vol = 0.3, freq = 1000, delay = 0 } = {}) {
  if (muted) return;
  const a = audio(), t = a.currentTime + delay;
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = noiseBuf;
  f.type = 'bandpass';
  f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(g).connect(master);
  s.start(t);
  s.stop(t + dur + 0.02);
}
const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28, 31, 33, 36];
const sfx = {
  // 발사: 낮게 떨어지는 '퐁' + 바람 소리
  shoot() { tone(880, 0.2, { type: 'square', vol: 0.45, slide: 0.3 }); noise(0.16, { vol: 0.6, freq: 2400 }); },
  // 충돌: 세기에 따라 커지는 둔탁한 소리
  hit(v) {
    const now = performance.now();
    if (now - lastHit < 60) return;
    lastHit = now;
    const k = Math.min(1, v / 25);
    // 폰 스피커는 저음이 거의 안 나므로 200Hz 위쪽으로 낸다
    tone(300 + Math.random() * 120, 0.13, { type: 'square', vol: 0.25 + 0.4 * k, slide: 0.5 });
    noise(0.1, { vol: 0.35 + 0.5 * k, freq: 1600 + 1200 * k });
  },
  // 블록 낙하: 떨어뜨릴수록 음이 올라간다
  fall(n) {
    const f = 523.25 * Math.pow(2, SCALE[Math.min(n, SCALE.length - 1)] / 12);
    tone(f, 0.25, { type: 'square', vol: 0.35 });
    tone(f * 2, 0.18, { type: 'triangle', vol: 0.35, delay: 0.03 });
  },
  clear() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.3, { type: 'square', vol: 0.4, delay: i * 0.1 })); },
  fail() { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.3, { type: 'sawtooth', vol: 0.35, delay: i * 0.16 })); },
  click() { tone(700, 0.07, { type: 'square', vol: 0.18 }); tone(1050, 0.08, { type: 'square', vol: 0.15, delay: 0.05 }); },
};
// ---------- 배경음 (잔잔한 우주풍 반복 음악, 합성) ----------
const CHORDS = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]]; // Am - F - C - G
const ARP = [0, 1, 2, 1, 0, 2, 1, 2];
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function mNote(freq, t, dur, type, vol, attack = 0.01) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(musicGain);
  o.start(t);
  o.stop(t + dur + 0.05);
}
function scheduleMusic() {
  // 조금 앞의 음까지 미리 예약해 박자가 흔들리지 않게 한다
  while (nextStep < actx.currentTime + 0.4) {
    const chord = CHORDS[Math.floor(stepIdx / 16) % CHORDS.length];
    const s = stepIdx % 16;
    if (s === 0) {
      for (const m of chord) mNote(mtof(m + 12), nextStep, STEP * 17, 'sawtooth', 0.05, 1.0); // 패드
      mNote(mtof(chord[0] - 12), nextStep, STEP * 15, 'triangle', 0.1, 0.05);                 // 베이스
      mNote(mtof(chord[0]), nextStep, STEP * 15, 'square', 0.05, 0.05);                      // 베이스(폰 스피커용 한 옥타브 위)
    }
    const up = s >= 8 && s % 4 === 3 ? 12 : 0;
    mNote(mtof(chord[ARP[s % 8]] + 24 + up), nextStep, STEP * 1.8, 'square', 0.09); // 아르페지오
    nextStep += STEP;
    stepIdx++;
  }
}
function startMusic() {
  if (musicTimer || muted) return;
  audio();
  nextStep = actx.currentTime + 0.1;
  musicTimer = setInterval(scheduleMusic, 100);
}
function stopMusic() { clearInterval(musicTimer); musicTimer = null; }
document.addEventListener('visibilitychange', () => {
  if (!actx) return;
  if (document.hidden) actx.suspend(); else if (!muted) actx.resume();
});

function setMuted(m) {
  muted = m;
  if (actx) master.gain.value = m ? 0 : VOLUME;
  if (m) stopMusic(); else if (state !== 'menu') startMusic();
  $('mute').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/>${m ? '<path d="m22 9-6 6M16 9l6 6"/>' : '<path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/>'}</svg>`;
  $('mute').classList.toggle('off', m);
  $('mute').setAttribute('aria-label', m ? '소리 켜기' : '소리 끄기');
  try { localStorage.setItem('bb-muted', m ? '1' : '0'); } catch {}
}
setMuted(muted);
$('mute').addEventListener('click', () => { setMuted(!muted); sfx.click(); });
$('ov-btn').addEventListener('click', () => { sfx.click(); startMusic(); });

// ---------- 공 던지기 ----------
const ballGeo = new THREE.SphereGeometry(0.35, 24, 16);
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

const nextColor = () => new THREE.Color().setHSL((ballCount * 0.17) % 1, 1, 0.6);
muzzleMat.emissive.copy(nextColor());

// 포인터가 가리키는 지점(블록·바닥에 닿는 곳)을 조준점으로 삼는다
function aimAt(e) {
  mouse.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(mouse, camera);
  const targets = blocks.filter(b => b.mesh.visible).map(b => b.mesh);
  targets.push(platMesh);
  const hit = raycaster.intersectObjects(targets, false)[0];
  if (hit) aimTarget.copy(hit.point);
  else raycaster.ray.at(18, aimTarget);
}
renderer.domElement.addEventListener('pointermove', aimAt);

const SPEED = 32;
renderer.domElement.addEventListener('pointerdown', e => {
  if (state !== 'play' || ballsLeft <= 0) return;
  aimAt(e);
  updateCannon(0);
  const start = muzzle.getWorldPosition(new THREE.Vector3());
  const dir = aimTarget.clone().sub(start);
  const dist = dir.length();
  dir.normalize();

  const body = new CANNON.Body({ mass: 4, material: matBall, shape: new CANNON.Sphere(0.35), linearDamping: 0.01 });
  body.position.set(start.x, start.y, start.z);
  // 중력으로 떨어지는 만큼 위로 보정해 조준한 곳에 맞게 한다
  body.velocity.set(dir.x * SPEED, dir.y * SPEED + 0.5 * 9.82 * (dist / SPEED), dir.z * SPEED);
  world.addBody(body);
  // 공마다 다른 색으로 빛난다
  const color = nextColor();
  ballCount++;
  recoil = 1;
  sfx.shoot();
  burst(start, color, 18, 3, 0.4);
  muzzleMat.emissive.copy(nextColor());
  const mesh = new THREE.Mesh(ballGeo, new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: color, emissiveIntensity: 0.9, metalness: 0.3, roughness: 0.2 }));
  mesh.castShadow = true;
  scene.add(mesh);
  body.addEventListener('collide', e => {
    const blk = e.body.blockRef;
    const v = Math.abs(e.contact.getImpactVelocityAlongNormal());
    if (v > 2) sfx.hit(v);
    if (blk && v > 4) burst(body.position, blk.mesh.material.color, Math.min(30, 6 + v), 5);
  });
  balls.push({ body, mesh, color, born: performance.now() });
  ballsLeft--;
  updateHud();
});

const keys = {};
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase() === 'r' && state !== 'menu') startLevel(level);
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// 터치 버튼: 누르고 있는 동안 회전
function holdButton(id, key) {
  const el = $(id);
  const set = v => e => { e.preventDefault(); keys[key] = v; el.classList.toggle('on', v); };
  el.addEventListener('pointerdown', set(true));
  for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) el.addEventListener(ev, set(false));
}
holdButton('t-left', 'a');
holdButton('t-right', 'd');
$('t-reset').addEventListener('click', () => { if (state !== 'menu') startLevel(level); });
addEventListener('contextmenu', e => e.preventDefault());

// 세로 화면에서는 시야를 넓혀 섬 전체가 보이게 한다
function fitCamera() {
  camera.aspect = innerWidth / innerHeight;
  camera.fov = camera.aspect < 1 ? Math.min(95, 55 / Math.max(camera.aspect, 0.45) * 0.8) : 55;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', fitCamera);
fitCamera();

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');

// ---------- 루프 ----------
let last = performance.now();
function tick(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;

  if (keys['a'] || keys['arrowleft']) { camAngle -= dt * 1.5; placeCamera(); }
  if (keys['d'] || keys['arrowright']) { camAngle += dt * 1.5; placeCamera(); }

  // 잠든 블록은 받침이 사라져도 스스로 깨어나지 않아 공중에 뜬다.
  // 무엇이든 움직이는 동안에는 남은 블록을 모두 깨워 둔다.
  const SLEEPING = CANNON.Body.SLEEPING;
  const active =
    balls.some(b => b.body.sleepState !== SLEEPING && b.body.position.y > -3) ||
    blocks.some(b => !b.out && b.body.sleepState !== SLEEPING && b.body.velocity.lengthSquared() > 0.01);
  if (active) for (const b of blocks) if (!b.out && b.body.sleepState === SLEEPING) b.body.wakeUp();

  world.fixedStep(1 / 60, dt);

  for (const b of blocks) {
    b.mesh.position.copy(b.body.position);
    b.mesh.quaternion.copy(b.body.quaternion);
    if (!b.out && b.body.position.y < -1.5) {
      b.out = true;
      sfx.fall(knockedCount() - 1);
      burst(b.body.position, b.mesh.material.color, 24, 6, 1.1);
      levelScore += 100;
      updateHud();
    }
    if (b.body.position.y < -40 && b.mesh.visible) { b.mesh.visible = false; b.body.sleep(); b.body.type = CANNON.Body.STATIC; }
  }
  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i];
    b.mesh.position.copy(b.body.position);
    b.mesh.quaternion.copy(b.body.quaternion);
    if (b.body.velocity.length() > 6)
      emit(b.body.position.x + (Math.random() - 0.5) * 0.3, b.body.position.y + (Math.random() - 0.5) * 0.3, b.body.position.z + (Math.random() - 0.5) * 0.3, 0, 0, 0, b.color, 0.45, 0);
    if (b.body.position.y < -40 || now - b.born > 12000) {
      world.removeBody(b.body); scene.remove(b.mesh); b.mesh.material.dispose(); balls.splice(i, 1);
    }
  }

  // 배경 연출
  const t = now / 1000;
  skyMat.uniforms.t.value = t;
  for (const c of crystals) {
    c.ang += c.speed * dt;
    c.mesh.position.set(Math.cos(c.ang) * c.r, c.y + Math.sin(t * 0.8 + c.r) * 0.6, Math.sin(c.ang) * c.r);
    c.mesh.rotation.y += c.spin * dt;
    c.mesh.rotation.x += c.spin * 0.4 * dt;
  }
  updateCannon(dt);
  glowA.position.set(Math.cos(t * 0.5) * 9, 4, Math.sin(t * 0.5) * 9);
  glowB.position.set(Math.cos(t * 0.5 + Math.PI) * 9, 5, Math.sin(t * 0.5 + Math.PI) * 9);
  updateParticles(dt);

  if (state === 'play') {
    const allOut = blocks.length && knockedCount() === blocks.length;
    if (allOut) {
      state = 'end';
      confetti();
      sfx.clear();
      const bonus = ballsLeft * 150;
      score += levelScore + bonus;
      levelScore = 0;
      saveProgress(level + 1 < LEVELS.length ? level + 1 : 0, score);
      updateHud();
      if (level + 1 < LEVELS.length) {
        showOverlay('클리어!', `남은 공 보너스 +${bonus}<br>누적 점수 ${score}`, '다음 레벨', () => startLevel(level + 1));
      } else {
        showOverlay('모든 레벨 완료!', `최종 점수 <b>${score}</b>`, '처음부터', () => { score = 0; startLevel(0); });
      }
    } else if (ballsLeft === 0) {
      // 마지막 공 이후 블록이 멈출 때까지 잠시 대기
      endTimer += dt;
      const moving = blocks.some(b => !b.out && b.body.sleepState !== CANNON.Body.SLEEPING && b.body.velocity.length() > 0.2);
      if (endTimer > 6 || (endTimer > 2.5 && !moving && balls.length === 0)) {
        state = 'end';
        sfx.fail();
        showOverlay('공이 떨어졌어요', `${knockedCount()}/${blocks.length}개를 떨어뜨렸습니다.`, '다시 도전', () => startLevel(level));
      }
    }
  }

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// 첫 화면: 저장된 진행이 있으면 '이어하기'를 앞에 둔다 (?level=N 테스트 시작은 저장을 무시)
const saved = new URLSearchParams(location.search).has('level') ? null : loadProgress();
if (saved) {
  $('ov-btn').textContent = `이어하기 · 레벨 ${saved.level + 1}`;
  $('ov-btn').onclick = () => { score = saved.score; startLevel(saved.level); };
  $('ov-new').hidden = false;
  $('ov-new').onclick = () => { sfx.click(); saveProgress(0, 0); score = 0; startLevel(0); startMusic(); };
} else {
  $('ov-btn').onclick = () => { score = 0; startLevel(START_LEVEL); };
}
window.__bb = {
  levels: LEVELS.length,
  wakeAll: () => blocks.forEach(b => b.body.wakeUp()),
  // 화면 갱신 없이 물리만 sec초 진행(숨겨진 창에서 테스트용). 실제 루프와 같은 깨우기 규칙을 쓴다.
  step(sec) {
    for (let i = 0; i < sec * 60; i++) {
      const S = CANNON.Body.SLEEPING;
      const active = balls.some(b => b.body.sleepState !== S && b.body.position.y > -3) ||
        blocks.some(b => !b.out && b.body.sleepState !== S && b.body.velocity.lengthSquared() > 0.01);
      if (active) for (const b of blocks) if (!b.out && b.body.sleepState === S) b.body.wakeUp();
      world.step(1 / 60);
    }
  },
  fallen: () => blocks.filter(b => b.body.position.y < -1.5).length,
  go: i => startLevel(i),
  dropAll: () => blocks.forEach(b => { b.body.position.y = -5; }),
  tick: t => tick(t),
  project: (x, y, z) => { const v = new THREE.Vector3(x, y, z).project(camera); return [(v.x + 1) / 2 * innerWidth, (1 - v.y) / 2 * innerHeight]; },
  ballPos: () => balls.map(b => [b.body.position.x, b.body.position.y, b.body.position.z].map(v => +v.toFixed(1))),
  pos: () => blocks.map(b => [b.body.position.x, b.body.position.y, b.body.position.z]),
};
</script>
</body>
</html>
